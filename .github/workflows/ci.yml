name: Pinflix CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check bridge syntax
        run: |
          node --check bridge/server.mjs
          node --check bridge/media.mjs
          node --check bridge/moviebox.mjs
          node --check bridge/provider-adapters.mjs

      - name: Check Windows bootstrap syntax
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw bridge/setup-windows.ps1))

      - name: Build
        run: npm run build
